<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Nareen</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);padding:24px;border-radius:24px;text-align:center;max-width:420px;box-shadow:0 0 30px rgba(255,215,0,.3);animation:float 3s ease-in-out infinite}
img{width:220px;border-radius:18px;border:4px solid gold}
h1{animation:glow 2s infinite}
button{padding:12px 20px;border:none;border-radius:20px;background:#ffd700;cursor:pointer}
.conf{position:fixed;top:-10px;width:8px;height:8px;background:#fff;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes glow{50%{text-shadow:0 0 20px gold}}
@keyframes float{50%{transform:translateY(-10px)}}
</style></head><body>
<div class="card">
<h1>🎉 Happy Birthday Nareen 🎂</h1>
<p><b>To My Dear Brother ❤️</b></p>
<img src="1000464474.jpg" alt="Nareen">
<p id="msg"></p>
<button onclick="surprise()">🎁 Open Surprise</button>
</div>
<script>
const text="May your life be filled with happiness, success, good health and endless smiles. Happy Birthday!";
let i=0;function type(){if(i<text.length){msg.innerHTML+=text.charAt(i++);setTimeout(type,35)}}type();
function confetti(){for(let i=0;i<120;i++){let d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=`hsl(${Math.random()*360},90%,60%)`;d.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}
function surprise(){confetti();alert("🎂 Happy Birthday Nareen! Have an amazing year! ❤️");}
</script></body></html>
